<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Multi App</h1>
        <p>Dar vida al sitio web utilizando JavaScript.</p>
    </header>

    <main>
        <section>
            <h2>1️⃣ Saludar al Usuario</h2>
            <input id="nameInput" type="text" placeholder="Escriba su nombre">
            <button id="saludarBtn">Saludar</button>
        </section>

        <section>
            <h2>2️⃣ Cambiar Mensaje</h2>
            <h5>Su mensaje es:</h5>
            <p id="messageText"></p>
            <input id="messageInput" type="text" placeholder="Escriba el texto">
            <button id="messageBtn">Mostrar mensaje</button>
        </section>

        <section>
            <h2>3️⃣ Contador</h2>
            <p>Contador: <strong id="counterValue">0</strong></p>
            <div class="button-group">
                <button id="incrementBtn">Incrementar</button>
                <button id="decrementBtn">Decrementar</button>
                <button id="resetBtn">Reiniciar</button>
            </div>
        </section>

        <section>
            <h2>4️⃣ Mostrar y Ocultar</h2>
            <div id="infoBlock">
                <img src="https://picsum.photos/200/300" alt="Imagen de ejemplo">
            </div>
            <div class="button-group">
                <button id="showBtn">Mostrar</button>
                <button id="hideBtn">Ocultar</button>
            </div>
        </section>
    </main>

    <footer>
        <small>Programación en Ambiente Web I · JavaScript + MVC</small>
    </footer>

    <script src="javascript.js"></script>
</body>

</html>
